<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Turnix</title>
</head>
<body>

  <div class="login">
    <!-- Left intro panel -->
    <section class="login-intro">
      <div class="login-intro__badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 6L3 12l6 6M15 6l6 6-6 6"/>
        </svg>
      </div>

      <h1 class="login-intro__title">Welcome Back</h1>
      <p class="login-intro__lede">
        Manage queues efficiently and deliver exceptional service experiences.
      </p>

      <div class="login-illustration">
        <div class="login-illustration__scene">
          <span class="login-illustration__ping login-illustration__ping--1"></span>
          <span class="login-illustration__ping login-illustration__ping--2"></span>

          <div class="login-illustration__card">
            <div class="login-illustration__bar login-illustration__bar--fill" style="width: 70%;"></div>
            <div class="login-illustration__bar" style="width: 90%;"></div>
            <div class="login-illustration__bar login-illustration__bar--fill" style="width: 50%;"></div>
            <div class="login-illustration__bar" style="width: 75%;"></div>
          </div>

          <div class="login-illustration__people">
            <span class="login-illustration__avatar"></span>
            <span class="login-illustration__avatar"></span>
            <span class="login-illustration__avatar"></span>
          </div>
        </div>
      </div>

      <ul class="login-features">
        <li class="login-features__item">
          <span class="login-features__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="5" y="11" width="14" height="9" rx="2"/>
              <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
          </span>
          Secure Access
        </li>
        <li class="login-features__item">
          <span class="login-features__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7v5l3 3"/>
            </svg>
          </span>
          Real-Time Queue Management
        </li>
        <li class="login-features__item">
          <span class="login-features__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/>
            </svg>
          </span>
          Fast &amp; Reliable
        </li>
      </ul>
    </section>

    <!-- Right form panel -->
    <section class="login-form-side">
      <div class="login-card">
        <div class="login-card__header">
          <h1>Sign in to Turnix</h1>
          <p>Access your management dashboard</p>
        </div>

        <form id="login-form" novalidate>
          <div class="form-field">
            <label for="email">Email address</label>
            <div class="input-icon-group">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2"/>
                <path d="m3 7 9 6 9-6"/>
              </svg>
              <input type="email" id="email" name="email" placeholder="name@company.com" required>
            </div>
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <div class="input-icon-group">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <rect x="5" y="11" width="14" height="9" rx="2"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
              </svg>
              <input type="password" id="password" name="password" placeholder="••••••••" required>
              <button type="button" class="input-icon-group__toggle" aria-label="Show password" data-password-toggle>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <label class="checkbox-field">
            <input type="checkbox" id="remember" name="remember">
            Remember me
          </label>

          <button type="submit" class="btn btn--primary btn--block">Sign In</button>

          <hr class="login-card__divider">

          <p class="login-card__footnote">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 8v4M12 16h.01"/>
            </svg>
            Only authorized employees and administrators can access this system.
          </p>
        </form>
      </div>
    </section>
  </div>

  <script>
    // Simple show/hide password toggle
    document.querySelectorAll('[data-password-toggle]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = btn.previousElementSibling;
        const isHidden = input.type === 'password';
        input.type = isHidden ? 'text' : 'password';
        btn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      });
    });
  </script>
</body>
</html>
